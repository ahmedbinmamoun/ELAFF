; Elaf overrides (both dev and prod)
date.timezone = Africa/Khartoum
memory_limit = 512M
; Issue PDFs can reach 150 MB (PRD §11).
upload_max_filesize = 160M
post_max_size = 160M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
